# Recorrido funcional (BS-F): la acción principal de cada una de las 22 pantallas de
# `frontend-desktop/src/shell/rutas.ts` y el resultado visible que prueba que funcionó.
#
# Lo ejecuta `scripts/recorrido_ux_playwright.py --funcional`, en el orden de este archivo y navegando
# por URL (`#/<ruta>`), no por el menú. Cuentas ficticias de `tests/fixtures/sesion_web.py`:
# admin (administra), ana (arma), rita (revisa). Carpetas de trabajo: los casos de demostración que
# siembra `start.preparar_demo` (demo.db, s1.db, ti001.db, of001.db, obra_control.db).
#
# Formato de cada fila:
#   ruta, cuenta, accion (qué se prueba, en una línea), carpeta y proyecto (opcionales),
#   pasos = [ { accion = "llenar" | "elegir" | "pulsar" | "marcar" | "subir" | "ir" | "esperar" | "tecla", ... } ]
#   espera = { texto = "...", textos = [...], ausentes = [...], descarga = "<clave>", huella = true, ms = 30000 }
#   requiere = ["<ruta>"]: filas anteriores de las que depende; `--solo` las agrega solas.
# - ausentes: textos que NO deben verse al final (prueban que un filtro o una búsqueda quitó algo).
# - Toda fila falla, además, si queda a la vista un aviso de error de Carbon (en línea, accionable o toast).
# - llenar: rotulo (etiqueta exacta del campo), valor («{hoy}» = la fecha del día); fuera = true busca fuera de <main>.
# - elegir: rotulo, opcion (valor o parte del texto de la opción).
# - pulsar: nombre (nombre accesible), rol (button por omisión; tab, link...), exacto (true por omisión),
#   descarga = "<clave>" (guarda lo que baje con esa clave para filas siguientes).
# - marcar: rotulo de una casilla o un botón de opción.
# - subir: zona (parte del nombre del botón de la zona de subida), archivo (clave: libro_limpio, bcv_tasa,
#   precios_empresa_s1, lista_precios, topologia_ti001, o una descarga anterior como «paquete»).
# - indice = n elige la n-ésima coincidencia (0 por omisión).
# Todo dato es ficticio («Contratista Demo, C.A.», J-00000000-0, contraseñas de prueba).

# ---------------------------------------------------------------------------------------------
# Siembra adicional: la empresa ficticia y su clave de firma (la usa «Entregar paquete»).
# La genera el administrador ficticio desde el propio equipo (servidor en 127.0.0.1).
[[siembra]]
ruta = "administracion"
cuenta = "admin"
accion = "empresa ficticia y clave de firma de prueba"
pasos = [
  { accion = "pulsar", rol = "tab", nombre = "Empresa y clave de firma" },
  { accion = "llenar", rotulo = "Nombre de la empresa", valor = "Contratista Demo, C.A." },
  { accion = "llenar", rotulo = "RIF", valor = "J-00000000-0" },
  { accion = "llenar", rotulo = "Ciudad", valor = "Ciudad Ficticia" },
  { accion = "pulsar", nombre = "Guardar la empresa" },
  { accion = "esperar", texto = "Generar la clave de firma" },
  { accion = "llenar", rotulo = "Contraseña de la clave (12 a 128 caracteres)", valor = "clave de firma de prueba 01" },
  { accion = "llenar", rotulo = "Repítala", valor = "clave de firma de prueba 01" },
  { accion = "pulsar", nombre = "Generar la clave" },
]
espera = { texto = "Huella de la clave de firma" }

# Un cambio de precio ANTERIOR a hoy (vigencia 2026-10-01) en demo: «Histórico» debe quitarlo al filtrar
# «desde hoy». La demostración no trae ninguno (tabla cambio_precio vacía en demo.db). Va después de la
# lista base de DEMO-001 (2026-09-20): con una vigencia anterior a ella, los insumos que la lista nueva no
# menciona quedan sin precio y la revaloración se rechaza (409; probado con 2026-06-01).
[[siembra]]
ruta = "actualizacion"
cuenta = "ana"
carpeta = "demo.db"
accion = "revaloración ficticia con vigencia 2026-10-01 (cambios de precio anteriores a hoy)"
pasos = [
  { accion = "elegir", rotulo = "Presupuesto base", opcion = "DEMO-001" },
  { accion = "llenar", rotulo = "Código de la versión nueva", valor = "FUN-01" },
  { accion = "llenar", rotulo = "Fecha de vigencia", valor = "2026-10-01" },
  { accion = "llenar", rotulo = "Nombre de la lista", valor = "Lista antigua ficticia" },
  { accion = "subir", zona = "Suelte aquí la lista de precios", archivo = "lista_precios" },
  { accion = "pulsar", nombre = "Revalorar presupuesto" },
]
espera = { textos = ["Comparativo por partida", "Informe de auditoría de la versión nueva"] }

