# Integracion continua (spec: 2026-09-14-ci-integracion-continua-design.md).
# Cuatro garantias: suite + ruff en Linux sin omitidas, guardia del nucleo, cobertura de core/
# >= 80 % y artefactos reproducibles, y la suite tambien en Windows (RNF-06, RNF-07).
# Desde la sesion de limpieza (2026-09-15) se suma la meta de datos: ninguna afirmacion de la
# documentacion presenta como reales los APU y presupuestos didacticos del repositorio.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Solo se cancelan las corridas de PR al llegar un push nuevo; las de main se completan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"

defaults:
  run:
    shell: bash

jobs:
  calidad:
    name: calidad (ruff + guardia del nucleo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historia completa
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.1.0 # sin etiqueta flotante v10: version exacta
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Entorno minimo (grupo dev)
        run: uv sync --locked --only-group dev

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Guardia del nucleo
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.base_ref }}
          ANTES: ${{ github.event.before }}
        run: |
          case "$EVENTO" in
            pull_request)
              base="origin/$BASE_PR"
              ;;
            push)
              if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
                echo "::notice::primer push de la rama: no hay rango que evaluar"
                exit 0
              fi
              base="$ANTES"
              ;;
            *)
              base="origin/main"
              ;;
          esac
          uv run --no-sync python scripts/guardia_nucleo.py --base "$base"

      - name: Meta de datos (naturaleza de los datos, NORMAS.md seccion 1)
        run: uv run --no-sync python scripts/meta_datos.py

  pruebas:
    name: pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: "1" # la suite corre sin red (maestro 6.3, RV-17); solo baja el paso del modelo
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # C3 y C5 de la meta leen el historial y la etiqueta v0.5.0

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.1.0 # sin etiqueta flotante v10: version exacta
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Cache del modelo de similitud
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-paraphrase-multilingual-MiniLM-L12-v2

      - name: Entorno completo (todos los extras)
        run: uv sync --locked --all-extras

      - name: Modelo de similitud (antes de pytest; con la cache no baja nada)
        env:
          HF_HUB_OFFLINE: "0"
        run: uv run --no-sync python scripts/descargar_modelo.py

      - name: Suite (pytest -W error)
        run: >-
          uv run --no-sync pytest -W error -p no:cacheprovider
          --junitxml=reporte-pruebas.xml
          --cov=core --cov=ml --cov=api --cov=adapters
          --cov=seguridad --cov=paquete --cov=asistente --cov=operacion
          --cov-report=term

      - name: Sin pruebas omitidas
        run: uv run --no-sync python scripts/verificar_omitidas.py reporte-pruebas.xml

      - name: Medicion de RNF-11 (solo registra la cifra; no rompe la corrida)
        run: uv run --no-sync python scripts/medir_rnf11.py

      - name: Meta de Silice (maestro 6.3, RV-17)
        if: runner.os == 'Linux'
        run: >-
          uv run --no-sync python scripts/meta_silice.py
          --version 0.6.0 --hasta S1-5 --junit reporte-pruebas.xml

      - name: Meta de Silice 0.7.0
        if: runner.os == 'Linux'
        run: >-
          uv run --no-sync python scripts/meta_silice.py
          --version 0.7.0 --hasta S2-2 --junit reporte-pruebas.xml

      - name: Cobertura de core >= 80 % (RNF-06)
        if: runner.os == 'Linux'
        run: uv run --no-sync coverage report --include="core/*" --fail-under=80

      - name: Cobertura de adapters/espacio >= 80 % (meta S10)
        if: runner.os == 'Linux'
        run: uv run --no-sync coverage report --include="adapters/espacio/*" --fail-under=80

      - name: Cobertura de seguridad y paquete >= 80 % (S3-M4)
        if: runner.os == 'Linux'
        run: uv run --no-sync coverage report --include="seguridad/*,paquete/*" --fail-under=80

      - name: Artefactos reproducibles
        if: runner.os == 'Linux'
        run: |
          uv run --no-sync python scripts/exportar_openapi.py
          uv run --no-sync python scripts/generar_resultados_ml.py
          git diff --exit-code -- docs/api.json docs/resultados_ml.md
