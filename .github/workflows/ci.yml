# Integracion continua (spec: 2026-09-14-ci-integracion-continua-design.md).
# Cuatro garantias: suite + ruff en Linux sin omitidas, guardia del nucleo, cobertura de core/
# >= 80 % y artefactos reproducibles, y la suite tambien en Windows (RNF-06, RNF-07).
# La suite se reparte en tramos paralelos por archivo (scripts/dividir_suite.py); el trabajo
# agregar une los JUnit y la cobertura de los tramos y aplica las garantias de siempre.
# Desde la sesion de limpieza (2026-09-15) se suma la meta de datos: ninguna afirmacion de la
# documentacion presenta como reales los APU y presupuestos didacticos del repositorio.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Solo se cancelan las corridas de PR al llegar un push nuevo; las de main se completan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"

defaults:
  run:
    shell: bash

jobs:
  calidad:
    name: calidad (ruff + guardia del nucleo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historia completa
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.1.0 # sin etiqueta flotante v10: version exacta
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Entorno minimo (grupo dev)
        run: uv sync --locked --only-group dev

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Guardia del nucleo
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.base_ref }}
          ANTES: ${{ github.event.before }}
        run: |
          case "$EVENTO" in
            pull_request)
              base="origin/$BASE_PR"
              ;;
            push)
              if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
                echo "::notice::primer push de la rama: no hay rango que evaluar"
                exit 0
              fi
              base="$ANTES"
              ;;
            *)
              base="origin/main"
              ;;
          esac
          uv run --no-sync python scripts/guardia_nucleo.py --base "$base"

      - name: Meta de datos (naturaleza de los datos, NORMAS.md seccion 1)
        run: uv run --no-sync python scripts/meta_datos.py

  pruebas:
    name: pruebas (${{ matrix.os }} ${{ matrix.shard }}/5)
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: "1" # la suite corre sin red (maestro 6.3, RV-17); solo baja el paso del modelo
      TRAMO: ${{ matrix.shard }}
      TRAMOS: "5" # igual a la longitud de matrix.shard
      SISTEMA: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows (la corrida mas lenta) no corre en cada PR: corre en cada fusion a main.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # C3 y C5 de la meta leen el historial y la etiqueta v0.5.0

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.1.0 # sin etiqueta flotante v10: version exacta
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Cache del modelo de similitud
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-paraphrase-multilingual-MiniLM-L12-v2

      - name: Entorno completo (todos los extras)
        run: uv sync --locked --all-extras

      - name: Modelo de similitud (antes de pytest; con la cache no baja nada)
        env:
          HF_HUB_OFFLINE: "0"
        run: uv run --no-sync python scripts/descargar_modelo.py

      - name: Suite del tramo (pytest -W error)
        # Cada archivo de prueba cae en exactamente un tramo (scripts/dividir_suite.py). La
        # cobertura (solo Linux, donde se exige) va a un archivo por tramo que `agregar` combina.
        run: |
          uv run --no-sync python scripts/dividir_suite.py "$TRAMO" "$TRAMOS" | tr -d '\r' > tramo.txt
          mapfile -t archivos < tramo.txt
          echo "tramo $TRAMO/$TRAMOS: ${#archivos[@]} archivos"
          opciones=(-W error -p no:cacheprovider "--junitxml=reporte-$SISTEMA-$TRAMO.xml")
          if [ "$RUNNER_OS" = "Linux" ]; then
            export COVERAGE_FILE="cobertura-$SISTEMA-$TRAMO"
            opciones+=(--cov=core --cov=ml --cov=api --cov=adapters --cov-report=)
          fi
          uv run --no-sync pytest "${opciones[@]}" "${archivos[@]}"

      - name: Medicion de RNF-11 (solo registra la cifra; no rompe la corrida)
        if: matrix.shard == 1
        run: uv run --no-sync python scripts/medir_rnf11.py

      - name: Subir JUnit y cobertura del tramo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tramo-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            reporte-${{ matrix.os }}-${{ matrix.shard }}.xml
            cobertura-${{ matrix.os }}-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 14

  agregar:
    name: agregar (JUnit, omitidas, cobertura y metas)
    needs: pruebas
    if: always()
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # C3 y C5 de la meta leen el historial y la etiqueta v0.5.0

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.1.0 # sin etiqueta flotante v10: version exacta
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Cache del modelo de similitud
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-paraphrase-multilingual-MiniLM-L12-v2

      - name: Entorno completo (todos los extras)
        if: needs.pruebas.result == 'success'
        run: uv sync --locked --all-extras

      - name: Modelo de similitud (la meta C5 corre pytest)
        if: needs.pruebas.result == 'success'
        env:
          HF_HUB_OFFLINE: "0"
        run: uv run --no-sync python scripts/descargar_modelo.py

      - name: Descargar los tramos
        if: needs.pruebas.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: tramo-*
          merge-multiple: true

      - name: Unir los JUnit por sistema operativo (falla si falta un tramo)
        if: needs.pruebas.result == 'success'
        run: |
          uv run --no-sync python scripts/unir_junit.py --esperados 5 \
            --salida reporte-pruebas-ubuntu-latest.xml --pesos pesos-suite-ubuntu-latest.json \
            reporte-ubuntu-latest-*.xml
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            uv run --no-sync python scripts/unir_junit.py --esperados 5 \
              --salida reporte-pruebas-windows-latest.xml \
              --pesos pesos-suite-windows-latest.json reporte-windows-latest-*.xml
          fi

      - name: Sin pruebas omitidas
        if: needs.pruebas.result == 'success'
        run: |
          for reporte in reporte-pruebas-*.xml; do
            echo "== $reporte"
            uv run --no-sync python scripts/verificar_omitidas.py "$reporte"
          done

      - name: Medicion de RNF-11 (solo registra la cifra; no rompe la corrida)
        if: needs.pruebas.result == 'success'
        run: uv run --no-sync python scripts/medir_rnf11.py

      - name: Meta de Silice (maestro 6.3, RV-17)
        if: needs.pruebas.result == 'success'
        run: >-
          uv run --no-sync python scripts/meta_silice.py
          --version 0.6.0 --hasta S1-5 --junit reporte-pruebas-ubuntu-latest.xml

      - name: Meta de Silice 0.7.0
        if: needs.pruebas.result == 'success'
        run: >-
          uv run --no-sync python scripts/meta_silice.py
          --version 0.7.0 --hasta S2-2 --junit reporte-pruebas-ubuntu-latest.xml

      - name: Combinar la cobertura de los tramos
        if: needs.pruebas.result == 'success'
        run: uv run --no-sync coverage combine cobertura-ubuntu-latest-*

      - name: Cobertura de core >= 80 % (RNF-06)
        if: needs.pruebas.result == 'success'
        run: uv run --no-sync coverage report --include="core/*" --fail-under=80

      - name: Cobertura de adapters/espacio >= 80 % (meta S10)
        if: needs.pruebas.result == 'success'
        run: uv run --no-sync coverage report --include="adapters/espacio/*" --fail-under=80

      - name: Artefactos reproducibles
        if: needs.pruebas.result == 'success'
        run: |
          uv run --no-sync python scripts/exportar_openapi.py
          uv run --no-sync python scripts/generar_resultados_ml.py
          git diff --exit-code -- docs/api.json docs/resultados_ml.md

      - name: Subir los pesos medidos (para rebalancear scripts/pesos_suite.json)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pesos-suite
          path: pesos-suite-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Todos los tramos de pruebas pasaron
        if: always()
        run: |
          echo "resultado de los tramos: ${{ needs.pruebas.result }}"
          test "${{ needs.pruebas.result }}" = "success"
