# Plantilla de taxonomía de fallas para evaluación no circular (`scripts/inyector_fallas.py`).
#
# Instrucciones para quien la completa (Nicolaz o el tutor):
# - Redactar las categorías y sus pesos SIN abrir las reglas de auditoría de Sílice.
# - Operaciones válidas:
#     valor_fijo            reemplaza una fórmula por su valor guardado * (1 + delta)
#     referencia_desplazada desplaza en 1 la fila de una referencia en la fórmula (G27 -> G28)
#     rango_recortado       recorta en 1 el extremo de un rango (SUM(A1:A10) -> SUM(A1:A9))
#     signo                 invierte el signo de una constante numérica distinta de 0
#     escala                multiplica por 1000 una constante numérica distinta de 0
#     formula_borrada       borra la fórmula y deja la celda vacía
# - Campo opcional `hojas`: lista de nombres de hoja donde puede caer la categoría.
#   Si se omite, la operación puede caer en cualquier hoja con celdas elegibles.
# - Toda fuente bibliográfica marcada «por verificar» debe contrastarse antes de citarla.

[[categorias]]
id = "TAX-01"
nombre = "Fórmula sobrescrita con valor fijo"
fuente = "Panko y Halverson (1996): error mecánico por sobrescritura de fórmula (por verificar)"
operacion = "valor_fijo"
peso = 1.0
# hojas = ["PRESUPUESTO", "APU-01"]

