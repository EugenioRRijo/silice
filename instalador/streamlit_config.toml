# Configuración oficial de Streamlit de {app}\codigo (spec S5 §10.1). Es el ÚNICO config.toml que
# puede haber dentro de codigo\ (tests/unit/test_manifiesto.py). Contiene todo lo de
# .streamlit/config.toml del repositorio y las opciones fijas de la segunda capa.

[global]
developmentMode = false

[server]
address = "127.0.0.1"
headless = true
fileWatcherType = "none"
runOnSave = false
enableCORS = true
enableXsrfProtection = true
# MB; el mismo límite que los planos (RNF-12)
maxUploadSize = 20

[browser]
serverAddress = "127.0.0.1"
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[theme]
# La misma interfaz de trabajo que .streamlit/config.toml del repositorio (PLAN_SILICE_UI, tarea 1;
# ui/estilo.py). Faltaba: el programa instalado salía con el tema por defecto de Streamlit.
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#1B1F24"
borderColor = "#D5DAE1"
showWidgetBorder = true
baseRadius = "small"
font = "sans-serif"
