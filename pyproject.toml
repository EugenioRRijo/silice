[project]
name = "apu-system"
version = "0.1.0"
description = "Sistema de generacion y auditoria de Analisis de Precios Unitarios multidominio (BIM-5D asistido por aprendizaje automatico)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.0",
    "openpyxl>=3.1",
]

# Extras por capa. Se instalan solo cuando la sesion que los usa llega:
#   uv sync --extra civil   (I3.1)   uv sync --extra ml (I2, I6)   uv sync --extra ui --extra api (I1, F.1)
#   uv sync --extra informes (PDF del caso TI-001 y del glosario)
[project.optional-dependencies]
ui = ["streamlit>=1.36"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
civil = ["ifcopenshell>=0.8"]
ml = ["scikit-learn>=1.4", "sentence-transformers>=3.0", "xgboost>=2.0"]
informes = ["reportlab>=4.0", "matplotlib>=3.8"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx2>=2.12",  # TestClient de FastAPI (tests/integration/test_api.py)
]

# El repositorio es una aplicacion con varios paquetes de primer nivel (core, adapters, ml, ui, api),
# no una libreria publicable: uv no intenta construirlo y pytest resuelve los imports desde la raiz.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# Generadores de documentos PDF: las lineas largas son prosa del documento, no codigo.
"scripts/informe_ti001.py" = ["E501"]
"scripts/auditoria_ti001.py" = ["E501"]
"scripts/glosario_presupuestos.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "adapters", "ml", "ui", "api", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
